savedquery:
  type: Savedquery
  label: Saved Query
  description: ''
  namespace: com_zuora
  properties:
    ReadDeleted:
      type: BOOLEAN
      description: Indicates whether the query will retrieve only deleted records.
    Compression:
      type: STRING
      description: Specifies whether Zuora compresses the query results.
      enum:
        - NONE
        - GZIP
        - ZIP
    Query:
      type: STRING
      description: The query to perform.
    UpdatedDate:
      type: TIMESTAMP
      description: ''
    UpdatedById:
      type: STRING
      description: ''
    UseIndexJoin:
      type: BOOLEAN
      description: Indicates whether to use Index Join. Index join is useful when
        you have a specific reference value in your WHERE clause to index another
        large table by.
    OutputFormat:
      type: STRING
      description: Specifies the format of the query results.
      enum:
        - CSV
        - JSON
        - TSV
        - DSV
    QueryDescription:
      type: STRING
      description: A human readable saved query deascription.
    SourceData:
      type: STRING
      description: Specifies the data source that a query will be run against.
      enum:
        - LIVE
        - UNLIMITED
        - REVENUELIVE
        - WAREHOUSE
        - SNOWFLAKE
        - ZUORAWAREHOUSE
    QueryName:
      type: STRING
      description: The user readable saved query name.
    RecentJobId:
      type: STRING
      description: The ID of the most recent job run for this saved query.
    CreatedById:
      type: STRING
      description: ''
    ColumnSeparator:
      type: STRING
      description: The column separator to be used if OutputFormat is DSV.
    CreatedDate:
      type: TIMESTAMP
      description: ''
    Id:
      type: STRING
      description: ''
  relationships: []
