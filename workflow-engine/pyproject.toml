[project]
name = "zuora-workflow-engine"
version = "0.1.0"
description = "Vendored Zuora workflow plan validation and assembly engine for the coding agent plugin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "httpx>=0.27.0",
  "jsonschema>=4.20.0",
  "pydantic>=2.5.0",
  "structlog>=24.1.0",
]

[project.scripts]
workflow-engine = "workflow_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow_engine"]
